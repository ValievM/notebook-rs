<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" role="status" hidden></div>

  <header class="topbar">
    <div class="notebook-switch">
      <button id="notebook-button" type="button" class="notebook-button" aria-haspopup="true" aria-expanded="false">
        <span id="notebook-title">Блокнот не выбран</span><span aria-hidden="true">▾</span>
      </button>
      <div id="notebook-menu" class="menu" hidden>
        <ul id="notebook-list" class="list"></ul>
        <form id="new-notebook" class="inline-form">
          <input id="new-notebook-name" type="text" placeholder="Новый блокнот" aria-label="Название нового блокнота" autocomplete="off">
          <button type="submit" class="icon" aria-label="Создать блокнот">+</button>
        </form>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="open-metrics" type="button" class="quiet">Метрики</button>
      <button id="open-settings" type="button" class="quiet">Настройки</button>
    </div>
  </header>

  <div class="app">
    <section class="sources panel" aria-label="Источники">
      <h2>Источники</h2>
      <div id="drop" class="drop">Перетащите сюда файлы: текст, Markdown, PDF</div>
      <button id="pick-files" type="button">Добавить файлы…</button>
      <form id="add-url" class="inline-form">
        <input id="url" type="url" placeholder="Адрес страницы https://…" aria-label="Адрес веб-страницы" autocomplete="off">
        <button type="submit">Добавить</button>
      </form>
      <p id="source-status" class="hint" role="status"></p>
      <ul id="source-list" class="list"></ul>
    </section>

    <main class="chat" aria-label="Диалог">
      <div class="chat-tools">
        <button id="clear-history" type="button" class="quiet" disabled>Очистить диалог</button>
      </div>
      <div id="messages" class="messages" role="log" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="question" rows="2" placeholder="Задайте вопрос по источникам блокнота" aria-label="Вопрос"></textarea>
        <div class="composer-row">
          <label class="check" title="Модель сама планирует несколько поисков: для сравнений и вопросов из нескольких частей. Отвечает дольше.">
            <input type="checkbox" id="deep">
            <span>Глубокий вопрос</span>
          </label>
          <button type="submit" id="send" class="primary">Спросить</button>
        </div>
      </form>
    </main>

    <aside class="studio panel" aria-label="Студия">
      <h2>Студия</h2>
      <button id="summarize" type="button" class="tile">Конспект</button>
      <button id="compare" type="button" class="tile">Сравнить</button>
      <p id="selection-hint" class="hint"></p>
    </aside>

    <aside id="viewer" class="viewer" hidden aria-label="Источник">
      <header>
        <h2 id="viewer-title"></h2>
        <button id="viewer-close" type="button" class="icon" aria-label="Закрыть источник">×</button>
      </header>
      <div id="viewer-body" class="viewer-body"></div>
    </aside>
  </div>

  <aside id="settings" class="viewer" hidden aria-label="Настройки">
    <header>
      <h2>Настройки</h2>
      <button id="settings-close" type="button" class="icon" aria-label="Закрыть настройки">×</button>
    </header>
    <div class="viewer-body settings-body">
      <section class="settings-group" aria-label="Кто отвечает">
        <h3>Кто отвечает</h3>
        <p id="account-line" class="hint" role="status"></p>
        <div id="model-choice" class="model-choice" hidden>
          <label for="model-select">Модель</label>
          <select id="model-select"></select>
          <label for="effort-select">Размышление</label>
          <select id="effort-select"></select>
        </div>
        <button id="sign-in-button" type="button" hidden>Войти через ChatGPT</button>
      </section>
      <section class="settings-group" aria-label="Оформление">
        <h3>Оформление</h3>
        <label for="theme-select" class="field-label">Тема</label>
        <select id="theme-select">
          <option value="system">Как в системе</option>
          <option value="light">Светлая</option>
          <option value="dark">Тёмная</option>
        </select>
      </section>
      <section id="sign-out-group" class="settings-group" aria-label="Аккаунт" hidden>
        <h3>Аккаунт</h3>
        <button id="sign-out-button" type="button" class="quiet danger">Выйти из ChatGPT…</button>
        <div id="sign-out-confirm" class="confirm" role="alertdialog" aria-label="Подтверждение выхода" hidden>
          <p>Выйти из ChatGPT? Отвечать будет Codex, а чтобы вернуться, нужно снова войти.</p>
          <div class="confirm-buttons">
            <button id="sign-out-yes" type="button" class="danger">Да, выйти</button>
            <button id="sign-out-no" type="button">Отмена</button>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <aside id="metrics" class="viewer wide" hidden aria-label="Метрики">
    <header>
      <h2>Метрики</h2>
      <div class="metrics-controls">
        <select id="metrics-hours" aria-label="Период">
          <option value="1">за час</option>
          <option value="24" selected>за сутки</option>
          <option value="168">за неделю</option>
        </select>
        <button id="metrics-refresh" type="button">Обновить</button>
        <button id="metrics-close" type="button" class="icon" aria-label="Закрыть метрики">×</button>
      </div>
    </header>
    <div id="metrics-body" class="viewer-body"></div>
  </aside>

  <div id="toast" class="toast" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>

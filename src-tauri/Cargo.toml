[package]
name = "notebook-rs-app"
version = "0.1.0"
edition = "2024"
description = "The desktop window of notebook-rs"
license = "MIT"

[lib]
name = "notebook_rs_app"

[[bin]]
name = "notebook-rs-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[dependencies]
notebook-rs = { path = "..", features = ["fastembed"] }
tauri = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

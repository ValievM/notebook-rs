[package]
name = "notebook-rs"
version = "0.1.0"
edition = "2024"
description = "A NotebookLM-style research notebook: your sources, a strong model, answers with checked citations."
license = "MIT"

[workspace]
members = ["src-tauri"]

[[bin]]
name = "nb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
dom_smoothie = "0.18.2"
fastembed = { version = "7.5.0", optional = true }
getrandom = "0.4.3"
htmd = "0.5.6"
pdf-extract = "0.12.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
ureq = { version = "3.5.0", features = ["charset"] }

[dev-dependencies]
tempfile = "3"

[features]
fastembed = ["dep:fastembed"]

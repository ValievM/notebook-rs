[package]
name = "notebook-rs"
version = "0.1.0"
edition = "2024"
description = "A NotebookLM-style research notebook: your sources, a strong model, answers with checked citations."
license = "MIT"

[[bin]]
name = "nb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
